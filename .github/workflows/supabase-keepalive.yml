name: Supabase Keep-Alive

on:
  schedule:
    # Chạy định kỳ lúc 01:25 UTC (08:25 sáng giờ Việt Nam) mỗi 3 ngày
    # để dự án Supabase gói Free không bao giờ tự động bị Pause sau 7 ngày.
    - cron: "25 1 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keepalive:
    name: Ping cơ sở dữ liệu Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Tải mã nguồn
        uses: actions/checkout@v4

      - name: Gửi truy vấn Keep-Alive tới Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -f "supabase_keepalive.py" ]; then
            python3 supabase_keepalive.py
          elif [ -f "08_App_Theo_doi_Tien_do_Thi_cong/supabase_keepalive.py" ]; then
            python3 08_App_Theo_doi_Tien_do_Thi_cong/supabase_keepalive.py
          else
            echo "::error::Không tìm thấy tệp supabase_keepalive.py trong kho mã nguồn."
            exit 1
          fi
